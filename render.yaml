services:
  # NestJS API
  - type: web
    name: api
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        sync: false # Add your Neon database URL in Render dashboard
      - key: FRONTEND_URL
        value: http://localhost:5173 # Update this with your frontend URL when deployed
    healthCheckPath: /api
